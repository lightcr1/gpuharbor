worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Upstreams are resolved per request, so this one config works whether or not
  # the optional Open WebUI and OpenHands containers exist.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  limit_req_zone $binary_remote_addr zone=controller_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=controller_login:1m rate=6r/m;

  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;

  # No Strict-Transport-Security on purpose: the certificate comes from a local
  # CA, and HSTS would apply to every port of "localhost" and make certificate
  # errors impossible to click through. Add it yourself behind a real domain.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  # GPUHarbor controller and the OpenAI-compatible /v1 endpoint
  server {
    listen 8443 ssl;
    client_max_body_size 20m;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location = /api/login {
      limit_req zone=controller_login burst=5 nodelay;
      limit_req_status 429;
      set $controller http://controller:8080;
      proxy_pass $controller;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
      limit_req zone=controller_api burst=40 nodelay;
      set $controller http://controller:8080;
      proxy_pass $controller;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
    }
  }

  # Open WebUI (only reachable when compose.openwebui.tls.yml publishes the port)
  server {
    listen 8444 ssl;
    client_max_body_size 100m;

    location / {
      set $webui http://open-webui:8080;
      proxy_pass $webui;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }

  # OpenHands Agent Canvas (only reachable when compose.openhands.tls.yml publishes the port)
  server {
    listen 8445 ssl;
    client_max_body_size 100m;

    location / {
      set $openhands http://openhands:8000;
      proxy_pass $openhands;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
