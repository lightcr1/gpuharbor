name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install controller dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.lock
          pip install --no-deps .
          pip install "pytest>=8.3,<9" "pytest-asyncio>=0.25,<1"

      - name: Run tests
        run: pytest -q

      - name: Check dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("gpuharbor/static/index.html").read_text(encoding="utf-8")
          Path("/tmp/gpuharbor-ui.js").write_text(
              "\n".join(re.findall(r"<script>(.*?)</script>", html, re.S)), encoding="utf-8"
          )
          PY
          node --check /tmp/gpuharbor-ui.js

      - name: Validate Compose combinations
        run: ./scripts/check-compose

      - name: Reject committed secrets
        run: |
          if grep -rInE --exclude-dir=.git \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|rp_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,})' .; then
            echo "Potential secret committed." >&2
            exit 1
          fi
          echo "No secret patterns found."
