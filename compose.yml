services:
  controller:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - gpuharbor-data:/data
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gpuharbor-data:
