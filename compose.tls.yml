# HTTPS in front of everything. The plain HTTP port of every service is limited
# to this machine, so only TLS is reachable from the network.
services:
  controller:
    ports: !override
      - "127.0.0.1:8080:8080"

  reverse-proxy:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./tls/server.key:/etc/nginx/tls/server.key:ro
    ports:
      - "${TLS_BIND_IP:-127.0.0.1}:${TLS_PORT:-8443}:8443"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
